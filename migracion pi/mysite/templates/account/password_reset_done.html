
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cambiar contraseña</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --bg-body: linear-gradient(135deg, #f9fafb, #e5e7eb);
            --bg-card: #ffffff;
            --text-main: #111827;
            --text-muted: #6b7280;
            --border: #e5e7eb;
            --primary: #4f46e5;
            --primary-hover: #3730a3;
            --shadow: rgba(0, 0, 0, 0.15);
        }

        .dark {
            --bg-body: linear-gradient(135deg, #0b0c1a, #1e293b);
            --bg-card: rgba(26, 26, 46, 0.88);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border: #2d2d2d;
            --primary: #818cf8;
            --primary-hover: #6366f1;
            --shadow: rgba(0, 0, 0, 0.4);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: var(--bg-body);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: var(--text-main);
        }

        .container {
            width: 100%;
            max-width:620px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            backdrop-filter: blur(12px);
            border-radius: 25px;
            padding: 50px 60px;
            box-shadow: 0 10px 40px var(--shadow);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            justify-content: center;
            
            font-weight: bold;
            font-size: 18px;
            color: var(--text-main);
            padding-top:0;
        }

        .logo i {
            font-size: 20px;
            color: var(--primary);
        }

        h1 {
            text-align: center;
            font-size: 28px;
            margin-bottom: 25px;
            padding-top: 15px;
            color: var(--text-main);
        }

        p.subtitle {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 55px;
        }

        /* Cada campo del form Django */
        .field {
            position: relative;
            margin-bottom: 22px;
        }

        .field label {
            display: none; /* iconos hacen la función visual */
        }

        .field input,
        .field select,
        .field textarea {
            width: 100%;
            padding: 18px 18px 18px 46px;
            border: 1px solid var(--border);
            border-radius: 30px;
            outline: none;
            font-size: 16px;
            transition: 0.3s;
            background: var(--bg-card);
            color: var(--text-main);
        }

        .field input:focus,
        .field select:focus,
        .field textarea:focus {
            border: 1px solid var(--primary);
            box-shadow: 0 0 8px rgba(99, 102, 241, 0.25);
        }

        /* Errores de campo */
        .errors {
            list-style: none;
            margin-top: 6px;
            padding-left: 16px;
        }

        .errors li {
            color: #c0392b;
            font-size: 12px;
        }

        /* Errores globales (non_field_errors) */
        .non-field-errors {
            background: #fdecea;
            border: 1px solid #e74c3c;
            border-radius: 12px;
            padding: 10px 16px;
            margin-bottom: 14px;
        }

        .non-field-errors li {
            color: #c0392b;
            font-size: 13px;
            list-style: none;
        }

        /* Botón principal */
        .main-btn {
            width: 80%;
            padding: 16px;
            border: none;
            border-radius: 30px;
            background: var(--primary);
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 15px;
            margin: 15px auto 0; /* ← esto lo centra */
            display: block; 
        }

        .main-btn:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
        }

        .volver-login {
            display: block;
            text-align: center;
            margin-top: 12px;
            font-size: 14px;
            color: var(--text-muted);
            text-decoration: none;
            transition: 0.3s;
        }

        .volver-login:hover {
            color: var(--primary);
            text-decoration: underline;
        }

        /* Divider */
        .divider {
            text-align: center;
            margin: 18px 0;
            color: var(--text-muted);
            font-size: 14px;
        }
        


        /* Toggle ojo contraseña */
        .toggle-password {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            cursor: pointer;
            font-size: 15px;
            z-index: 1;
            transition: 0.3s;
        }

        .toggle-password:hover {
            color: var(--primary);
        }

        /* Responsive */
        @media (max-width: 900px) {
            .container {
                flex-direction: column;
                width: 100%;
            }

        }
    </style>
</head>
<body>
    
<div class="container">
    
    <div class="right-panel">

        <div class="logo">
            <i class="fa-solid fa-book-open"></i>
            <span>BookReviews</span>
        </div>

        <h1>Revisa tu correo!</h1>
        <p class="subtitle">Te enviamos un enlace para recuperar tu contraseña. Revisa tu correo y sigue las instrucciones.</p>

        <form method="post" novalidate>
            {% csrf_token %}

            {% if error %}
            <ul class="non-field-errors">
                <li>{{ error }}</li>
            </ul>

            {% endif %}
            <form action="{% url 'account_reset_password' %}">
                <button type="submit" class="main-btn">
                    Reenviar enlace
                </button>
            </form>
            
            <a href="{% url 'login' %}" class="volver-login">
                Volver al login
            </a>
        </form>
    </div>
</div>
<script>
        window.onload = () => {
        const savedTheme = localStorage.getItem("theme");

        if (savedTheme === "dark") {
            document.body.classList.add("dark");
        }
        if (savedTheme === "light") {
            document.body.classList.remove("dark");
        }
    };
</script>
</body>
</html>
