<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ libro.titulo }} — Reseña completa</title>

<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">

<style>
/* ────────────────────────────────
   Revista académica / journal
───────────────────────────────── */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
    --ink:      #1a1a1a;
    --ink2:     #4a4a4a;
    --ink3:     #7a7a7a;
    --rule:     #c8c0b0;
    --bg:       #faf8f4;
    --accent:   #8b0000; /* rojo académico */
    --serif:    'EB Garamond', Georgia, 'Times New Roman', serif;
    --sans:     'Source Sans 3', 'Helvetica Neue', Arial, sans-serif;
}

html { font-size: 18px; }

body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--serif);
    line-height: 1.8;
    padding: 0;
}

/* ── Banda superior del journal ── */
.journal-bar {
    background: var(--accent);
    color: #fff;
    font-family: var(--sans);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    text-align: center;
    padding: 9px 0;
}

/* ── Cabecera ── */
.journal-header {
    max-width: 780px;
    margin: 0 auto;
    padding: 56px 40px 0;
    border-bottom: 2px solid var(--ink);
    padding-bottom: 32px;
}

.meta-top {
    font-family: var(--sans);
    font-size: 11px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--ink3);
    margin-bottom: 20px;
    display: flex;
    gap: 18px;
    flex-wrap: wrap;
}

.meta-top span {
    display: flex;
    align-items: center;
    gap: 5px;
}

.category-pill {
    background: var(--accent);
    color: #fff;
    padding: 2px 10px;
    border-radius: 2px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1px;
}

h1 {
    font-family: var(--serif);
    font-size: 2.4rem;
    font-weight: 600;
    line-height: 1.2;
    color: var(--ink);
    margin-bottom: 18px;
    letter-spacing: -0.02em;
}

.byline {
    font-family: var(--sans);
    font-size: 14px;
    color: var(--ink2);
    border-top: 1px solid var(--rule);
    border-bottom: 1px solid var(--rule);
    padding: 12px 0;
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 22px;
}

.byline strong { color: var(--ink); }

/* ── Cuerpo del artículo ── */
.article-body {
    max-width: 780px;
    margin: 0 auto;
    padding: 48px 40px 80px;
}

/* Letra capital */
.article-body p:first-of-type::first-letter {
    font-size: 4.2rem;
    font-weight: 600;
    line-height: 1;
    float: left;
    margin: 4px 10px 0 0;
    color: var(--accent);
    font-family: var(--serif);
}

.article-body p {
    font-size: 1.05rem;
    line-height: 1.85;
    color: var(--ink);
    margin-bottom: 1.5em;
    text-align: justify;
    hyphens: auto;
}

/* Cita destacada */
blockquote {
    border-left: 3px solid var(--accent);
    margin: 2em 0;
    padding: 0.8em 1.5em;
    color: var(--ink2);
    font-style: italic;
    font-size: 1.1rem;
}

/* ── Pie del artículo ── */
.article-footer {
    max-width: 780px;
    margin: 0 auto;
    padding: 0 40px 60px;
    border-top: 1px solid var(--rule);
    padding-top: 28px;
    font-family: var(--sans);
    font-size: 13px;
    color: var(--ink3);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 14px;
}

.source-link {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    background: var(--ink);
    color: #fff;
    text-decoration: none;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.5px;
    padding: 9px 18px;
    border-radius: 2px;
    transition: background 0.2s;
}

.source-link:hover { background: var(--accent); }

.close-hint {
    font-style: italic;
    color: var(--ink3);
    font-size: 12px;
}

/* ── Número de página decorativo ── */
.page-number {
    text-align: center;
    font-family: var(--sans);
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--ink3);
    padding: 20px 0 40px;
}

/* ── Responsive ── */
@media (max-width: 600px) {
    html { font-size: 16px; }
    .journal-header, .article-body, .article-footer { padding-left: 20px; padding-right: 20px; }
    h1 { font-size: 1.8rem; }
}

/* ── Impresión limpia ── */
@media print {
    .journal-bar, .source-link, .close-hint { display: none; }
    body { background: #fff; }
}
</style>
</head>

<body>

<!-- Banda de identificación del journal -->
<div class="journal-bar">ScholarReview &nbsp;·&nbsp; Reseña académica</div>

<!-- Cabecera editorial -->
<header class="journal-header">
    <div class="meta-top">
        <span><span class="category-pill">{{ libro.Category }}</span></span>
        <span>Reseña bibliográfica</span>
    </div>

    <h1>{{ libro.titulo }}</h1>

    <div class="byline">
        <span>Por <strong>{{ libro.autor }}</strong></span>
        <span>ScholarReview</span>
    </div>
</header>

<!-- Cuerpo: reseña completa -->
<main class="article-body">
    {{ libro.texto|linebreaks }}
</main>

<!-- Pie -->
<footer class="article-footer">
    <span class="close-hint">Puede cerrar esta pestaña para volver a la ficha del libro.</span>
    <a href="{{ libro.link }}" target="_blank" rel="noopener" class="source-link">
        ↗ Ver fuente original
    </a>
</footer>

<div class="page-number">— 1 —</div>

</body>
</html>
