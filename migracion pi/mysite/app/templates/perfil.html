<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil</title>
    <link rel="stylesheet" href="../CSS/perfil.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
</head>
<body>

<header class="header">
    <a href="main_web.html" class="logo">ScholarReviews</a>
    <button id="toggleTema"><i class="fa-solid fa-moon"></i></button>
</header>

<div class="layout">

    <aside class="sidebar">
        <a href="main_web.html"><i class="fa-solid fa-house"></i> Inicio</a>
        <a href="perfil.html"><i class="fa-solid fa-user"></i> Perfil</a>
        <a href="generos.html"><i class="fa-solid fa-tags"></i> Categorias</a>
    </aside>

    <main class="main">
        <div class="perfil-header">

            <div class="perfil-img">
                <img src="../imagenes/user.jpg" id="fotoPerfil">
                <input type="file" id="inputFoto">
                <label for="inputFoto">Cambiar foto</label>
            </div>

            <div class="perfil-info">
                <h2 id="nombrePerfil">Usuario</h2>
                <p id="bioPerfil">Sin descripción...</p>
                <button onclick="mostrarEditor()">Editar perfil</button>
            </div>

        </div>

        <div class="perfil-stats">
            <div>
                <h3 id="totalPosts">0</h3>
                <span>Posts</span>
            </div>
            <div>
                <h3>0</h3>
                <span>Likes</span>
            </div>
        </div>

        <div class="formulario" id="editorPerfil">

            <img id="fotoPreview" src="../imagenes/user.jpg" style="width:80px; border-radius:50%; margin:auto;">

            <input type="file" id="inputFotoEditor">
            <input type="text" id="nombreInput" placeholder="Nombre...">
            <textarea id="bioInput" placeholder="Descripción..."></textarea>

            <div class="botons">
                <button onclick="guardarPerfil()">Guardar</button>
                <button onclick="cancelar()">Cancelar</button>
            </div>
        </div>

        <h2>Mis publicaciones</h2>
        <div class="grid-posts" id="misPosts"></div>

    </main>
</div>

<script>
if(localStorage.getItem("tema")){
    document.documentElement.setAttribute("data-theme", localStorage.getItem("tema"));
}

function toggleTema(){
    let tema = document.documentElement.getAttribute("data-theme");

    if(tema === "light"){
        document.documentElement.setAttribute("data-theme", "dark");
        localStorage.setItem("tema", "dark");
    } else {
        document.documentElement.setAttribute("data-theme", "light");
        localStorage.setItem("tema", "light");
    }
}

document.addEventListener("DOMContentLoaded", () => {
    const btn = document.getElementById("toggleTema");
    if(btn){
        btn.addEventListener("click", toggleTema);
    }
});

document.getElementById("inputFoto").addEventListener("change", leerFoto);
document.getElementById("inputFotoEditor").addEventListener("change", leerFoto);

function leerFoto(e){
    const file = e.target.files[0];
    if(!file) return;

    const reader = new FileReader();

    reader.onload = function(event){
        const base64 = event.target.result;

        localStorage.setItem("fotoPerfil", base64);

        document.getElementById("fotoPerfil").src = base64;
        document.getElementById("fotoPreview").src = base64;
    };

    reader.readAsDataURL(file);
}

function cargarPerfil(){
    document.getElementById("nombrePerfil").innerText = localStorage.getItem("nombre") || "Usuario";
    document.getElementById("bioPerfil").innerText = localStorage.getItem("bio") || "Sin descripción...";

    const foto = localStorage.getItem("fotoPerfil");
    if(foto){
        document.getElementById("fotoPerfil").src = foto;
        document.getElementById("fotoPreview").src = foto;
    }
}

function mostrarEditor(){
    document.getElementById("editorPerfil").style.display = "flex";

    document.getElementById("nombreInput").value = localStorage.getItem("nombre") || "";
    document.getElementById("bioInput").value = localStorage.getItem("bio") || "";
}

function guardarPerfil(){
    localStorage.setItem("nombre", document.getElementById("nombreInput").value);
    localStorage.setItem("bio", document.getElementById("bioInput").value);

    cargarPerfil();
    cancelar();
}

function cancelar(){
    document.getElementById("editorPerfil").style.display = "none";
}

function cargarPosts(){
    const contenedor = document.getElementById("misPosts");
    contenedor.innerHTML = "";

    const posts = JSON.parse(localStorage.getItem("posts")) || [];
    document.getElementById("totalPosts").innerText = posts.length;

    posts.forEach((post, index) => {
        const div = document.createElement("div");
        div.classList.add("post");

        div.innerHTML = `
            <img src="${post.imagen}">
            <h3>${post.titulo}</h3>
            <p>Autor: ${post.autor}</p>
            <p class="texto1">${post.texto}</p>
            ${post.link ? `<a href="${post.link}" target="_blank">Ver libro</a>` : ""}
            <div class="post-actions">
                <button onclick="eliminarPost(${index})">
                    <i class="fa-solid fa-trash"></i>
                </button>
            </div>
        `;

        contenedor.appendChild(div);
    });
}

function eliminarPost(index){
    if(confirm("¿Seguro que quieres eliminar este post?")){
        let posts = JSON.parse(localStorage.getItem("posts")) || [];
        posts.splice(index, 1);
        localStorage.setItem("posts", JSON.stringify(posts));
        cargarPosts();
    }
}

window.onload = () => {
    cargarPerfil();
    cargarPosts();
};


</script>
</body>
</html>

<style>
    :root {
    --bg: #0d1117;
    --card: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --text2: #8b949e;
    --accent: #2f81f7;
    --hover: #1f6feb;
}

[data-theme="light"] {
    --bg: #f5f7fa;
    --card: #ffffff;
    --border: #d0d7de;
    --text: #1f2328;
    --text2: #57606a;
    --accent: #0969da;
    --hover: #0550ae;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: var(--bg);
    color: var(--text);
    padding-top: 70px;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 30px;
    background: var(--card);
    border-bottom: 1px solid var(--border);
    position: fixed;
    top: 0;
    width: 100%;
    z-index: 1000;
}

.logo {
    color: var(--text);
    text-decoration: none;
    font-size: 20px;
}

.layout {
    display: flex;
}

.sidebar {
    position: fixed;
    top: 80px;
    left: 20px;
    width: 200px;
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.sidebar a {
    background: var(--card);
    padding: 10px;
    border-radius: 10px;
    border: 1px solid var(--border);
    text-decoration: none;
    color: var(--text);
    transition: 0.3s;
}

.sidebar a:hover {
    background: var(--border);
}

.main {
    margin-left: 240px;
    width: 100%;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 20px;
}

.perfil-header {
    display: flex;
    gap: 20px;
    background: var(--card);
    padding: 20px;
    border-radius: 10px;
    border: 1px solid var(--border);
    align-items: center;
}

.perfil-img {
    width: 130px;
    height: 130px;
    border-radius: 50%;
    overflow: hidden;
}

.perfil-img img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.perfil-img input {
    display: none;
}

.perfil-img label {
    display: block;
    margin-top: 10px;
    text-align: center;
    background: var(--accent);
    padding: 8px;
    border-radius: 10px;
    cursor: pointer;
    color: white;
}

.perfil-info {
    flex: 1;
}

.perfil-info p {
    color: var(--text2);
    margin: 10px 0;
}

button {
    background: var(--accent);
    border: none;
    padding: 10px;
    border-radius: 10px;
    color: white;
    cursor: pointer;
}

button:hover {
    opacity: 0.8;
}

.perfil-stats {
    display: flex;
    gap: 20px;
}

.perfil-stats div {
    flex: 1;
    background: var(--card);
    padding: 15px;
    border-radius: 10px;
    border: 1px solid var(--border);
    text-align: center;
}

.perfil-stats span {
    color: var(--text2);
}

#editorPerfil {
    display: none;
    flex-direction: column;
    gap: 10px;
    background: var(--card);
    padding: 15px;
    border-radius: 10px;
    border: 1px solid var(--border);
}

#editorPerfil input,
#editorPerfil textarea {
    padding: 10px;
    border-radius: 10px;
    border: none;
    background: var(--bg);
    color: var(--text);
}

.grid-posts {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 20px;
}

.post {
    background: var(--card);
    padding: 15px;
    border-radius: 10px;
    border: 1px solid var(--border);
}

.post img {
    width: 100%;
    height: 180px;
    object-fit: cover;
    border-radius: 10px;
}

@media (max-width: 768px) {
    .sidebar {
        display: none;
    }

    .main {
        margin-left: 0;
    }

    .perfil-header {
        flex-direction: column;
        text-align: center;
    }

    .perfil-stats {
        flex-direction: column;
    }
}

.post-actions {
    margin-top: 10px;
    display: flex;
    justify-content: flex-end;
}

.post-actions button {
    background: #473ce7;
    border: none;
    padding: 8px 12px;
    border-radius: 8px;
    color: white;
    cursor: pointer;
    font-size: 13px;
}

.post-actions button:hover {
    opacity: 0.8;
}
</style>
