<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background: white;
            padding: 2.5rem 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 480px;
            text-align: center;
        }

        .avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #4f46e5;
            margin-bottom: 1rem;
        }

        .avatar-placeholder {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: #e0e7ff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            margin: 0 auto 1rem;
            border: 4px solid #4f46e5;
        }

        h2 {
            color: #1a1a2e;
            font-size: 1.5rem;
            margin-bottom: .3rem;
        }

        .email {
            color: #888;
            font-size: .9rem;
            margin-bottom: 1rem;
        }

        .bio {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 1rem;
            color: #444;
            font-size: .95rem;
            margin-bottom: 1.5rem;
            text-align: left;
            line-height: 1.6;
        }

        .bio-empty {
            color: #aaa;
            font-style: italic;
        }

        .fecha {
            font-size: .8rem;
            color: #bbb;
            margin-bottom: 1.5rem;
        }

        .btn {
            display: inline-block;
            padding: .65rem 1.5rem;
            border-radius: 8px;
            font-size: .95rem;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            border: none;
            transition: background .2s;
        }

        .btn-primary {
            background: #4f46e5;
            color: white;
            margin-right: .5rem;
        }

        .btn-primary:hover { background: #4338ca; }

        .btn-secondary {
            background: #f0f2f5;
            color: #333;
        }

        .btn-secondary:hover { background: #e2e8f0; }
    </style>
</head>
<body>
<div class="card">

    {% if profile.foto %}
        <img src="{{ profile.foto.url }}" alt="Foto de perfil" class="avatar">
    {% else %}
        <div class="avatar-placeholder">👤</div>
    {% endif %}

    <h2>{{ profile.user.username }}</h2>
    <p class="email">{{ profile.user.email }}</p>

    <div class="bio">
        {% if profile.biografia %}
            {{ profile.biografia }}
        {% else %}
            <span class="bio-empty">Sin biografía aún.</span>
        {% endif %}
    </div>

    <p class="fecha">Miembro desde {{ profile.creado_en|date:"d/m/Y" }}</p>

    <a href="{% url 'editar_perfil' %}" class="btn btn-primary">✏️ Editar perfil</a>
    <a href="{% url 'home' %}" class="btn btn-secondary">🏠 Inicio</a>

</div>
</body>
</html>
