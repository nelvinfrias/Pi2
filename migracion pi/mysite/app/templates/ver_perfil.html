<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil de {{ usuario.username }}</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: linear-gradient(135deg, #eef2ff, #e9edf5);
            --bg-app: #ffffff;
            --card: #cbd4fe;
            --text: #1e1b4b;
            --text2: #6b7280;
            --primary: #4f51f4;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--bg-body);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background: var(--bg-app);
            padding: 2.5rem 2rem;
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 480px;
            text-align: center;
            border: 1px solid var(--card);
        }

        .avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--primary);
            margin-bottom: 1rem;
        }

        .avatar-placeholder {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: var(--card);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            margin: 0 auto 1rem;
            border: 4px solid var(--primary);
        }

        h2 {
            color: var(--text);
            font-size: 1.5rem;
            margin-bottom: .3rem;
        }

        .email {
            color: var(--text2);
            font-size: .9rem;
            margin-bottom: 1rem;
        }

        .bio {
            background: var(--card);
            border-radius: 12px;
            padding: 1rem;
            color: var(--text);
            font-size: .95rem;
            margin-bottom: 1.5rem;
            text-align: left;
            line-height: 1.6;
        }

        .bio-empty {
            color: var(--text2);
            font-style: italic;
        }

        .fecha {
            font-size: .8rem;
            color: var(--text2);
            margin-bottom: 1.5rem;
        }

        .btns {
            display: flex;
            gap: .8rem;
            justify-content: center;
        }

        .btn {
            padding: .65rem 1.5rem;
            border-radius: 10px;
            font-size: .9rem;
            font-weight: 600;
            text-decoration: none;
            transition: opacity .2s;
        }

        .btn:hover { opacity: .8; }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-secondary {
            background: var(--card);
            color: var(--text);
        }
    </style>
</head>
<body>
<div class="card">

    {% if profile.foto %}
        <img src="{{ profile.foto.url }}" class="avatar">
    {% else %}
        <div class="avatar-placeholder">👤</div>
    {% endif %}

    <h2>{{ usuario.username }}</h2>
    <p class="email">{{ usuario.email }}</p>

    <div class="bio">
        {% if profile.biografia %}
            {{ profile.biografia }}
        {% else %}
            <span class="bio-empty">Este usuario no tiene biografía.</span>
        {% endif %}
    </div>

    <p class="fecha">Miembro desde {{ profile.creado_en|date:"d/m/Y" }}</p>

    <div class="btns">
        <a href="{% url 'buscar_usuarios' %}" class="btn btn-secondary">← Volver</a>
        <a href="{% url 'home' %}" class="btn btn-primary">🏠 Inicio</a>
    </div>

</div>
</body>
</html>
