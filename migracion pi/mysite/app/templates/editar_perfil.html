<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Perfil</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background: white;
            padding: 2.5rem 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 420px;
        }

        h2 {
            text-align: center;
            margin-bottom: 1.8rem;
            color: #1a1a2e;
            font-size: 1.6rem;
        }

        .field {
            margin-bottom: 1.2rem;
        }

        label {
            display: block;
            margin-bottom: .4rem;
            font-weight: 600;
            font-size: .9rem;
            color: #333;
        }

        input, textarea {
            width: 100%;
            padding: .65rem .9rem;
            border: 1.5px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border-color .2s;
            font-family: inherit;
        }

        input:focus, textarea:focus { border-color: #4f46e5; }

        .errors li {
            color: #dc2626;
            font-size: .82rem;
            list-style: none;
            margin-top: .2rem;
        }

        .errors li::before { content: '⚠ '; }

        .foto-actual {
            display: block;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto .8rem;
            border: 3px solid #4f46e5;
        }

        button {
            width: 100%;
            padding: .75rem;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: .5rem;
            transition: background .2s;
        }

        button:hover { background: #4338ca; }

        .cancel-link {
            text-align: center;
            margin-top: 1rem;
            font-size: .9rem;
        }

        .cancel-link a {
            color: #4f46e5;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>
<div class="card">
    <h2>✏️ Editar perfil</h2>

    {% if request.user.profile.foto %}
        <img src="{{ request.user.profile.foto.url }}"
             alt="Foto actual" class="foto-actual">
    {% endif %}

    <form method="post" enctype="multipart/form-data" novalidate>
        {% csrf_token %}

        {% for field in form %}
        <div class="field">
            <label for="{{ field.id_for_label }}">{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}
            <ul class="errors">
                {% for error in field.errors %}
                <li>{{ error }}</li>
                {% endfor %}
            </ul>
            {% endif %}
        </div>
        {% endfor %}

        <button type="submit">💾 Guardar cambios</button>
    </form>

    <div class="cancel-link">
        <a href="{% url 'perfil' %}">← Cancelar</a>
    </div>
</div>
</body>
</html>
