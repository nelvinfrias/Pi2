<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>ScholarReview</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://unpkg.com/lucide@latest"></script>

</head>

<body>

<div class="app">

    <!-- HEADER -->
    <header class="header">
        <div class="logo">
            <i data-lucide="book"></i>
            <span>ScholarReview</span>
        </div>

        <nav class="nav">
            <span class="active">Main</span>
            <a href="p.html" class="nav-link">Perfil</a>
            <a href="explorar.html" class="nav-link">Explorar</a>
            <a href="comunidad.html" class="nav-link">Comunidad</a>
        </nav>

        <div class="profile">
            <div class="theme-switch" id="themeSwitch">
                <div class="switch-track">
                    <i data-lucide="moon" class="icon"></i>
                    <i data-lucide="sun" class="icon"></i>
                    <div class="switch-thumb"></div>
                </div>
            </div>
            <img src="https://i.pravatar.cc/40">
        </div>
    </header>

    <!-- BOTÓN -->
    <a href="/post/">
        <button class="create-btn">
            <i data-lucide="square-pen"></i>
        </button>
    </a>

    <main class="main">

        <!-- CARRUSEL -->
        <section class="hero">
            <div class="slides">
                <img src="../imagenes/L1.jpeg">
                <img src="../imagenes/L5.jpeg">
                <img src="../imagenes/L9.jpeg">
                <img src="../imagenes/L3.jpeg">
                <img src="../imagenes/L2.jpeg">

                <!-- duplicadas -->
                <img src="../imagenes/L1.jpeg">
                <img src="../imagenes/L5.jpeg">
                <img src="../imagenes/L9.jpeg">
                <img src="../imagenes/L3.jpeg">
                <img src="../imagenes/L2.jpeg">
            </div>
        </section>

        <!-- FILTROS -->
        <section class="filters">
            <input type="text" placeholder="Buscar...">
            <select><option>Categoría</option></select>
            <select><option>Nivel de Estudio</option></select>
            <button class="btn-search" onclick="buscar(this)">
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>
        </section>

        <!-- PUBLICACIONES -->
        <div class="publicaciones">
            {% for x in i %}
            <div class="post-card">
                <img src="{{ x.image.url }}">
                <h3>{{ x.titulo }}</h3>
                <p>{{ x.autor }}</p>
                <a href="{{ x.link }}" target="_blank">Ver link</a>
                <p>{{ x.texto }}</p>
            </div>
            {% endfor %}
        </div>

    </main>
</div>

<script>
const switchEl = document.getElementById("themeSwitch");

switchEl.addEventListener("click", () => {
    document.body.classList.toggle("dark");
    localStorage.setItem("theme", document.body.classList.contains("dark") ? "dark" : "light");
});

window.onload = () => {
    if (localStorage.getItem("theme") === "dark") {
        document.body.classList.add("dark");
    }
    lucide.createIcons();
};

const links = document.querySelectorAll(".nav-link");

links.forEach(link => {
    link.addEventListener("click", function(e) {
        e.preventDefault();
        document.body.classList.add("fade-out");
        setTimeout(() => {
            window.location.href = this.href;
        }, 250);
    });
});

function buscar(btn) {
  btn.classList.add("loading");
  setTimeout(() => {
    btn.classList.remove("loading");
  }, 2000);
}
</script>

<style>
:root {
    --bg-body: linear-gradient(135deg, #eef2ff, #e9edf5);
    --bg-app: #ffffff;
    --card: #cbd4fe;
    --text: #1e1b4b;
    --text2: #6b7280;
    --primary: #4f51f4;
}

.dark {
    --bg-body: linear-gradient(135deg, #0b0c1a, #1e293b);
    --bg-app: #1a1a2e;
    --card: #171824;
    --text: #e0e7ff;
    --text2: #9ca3af;
    --primary: #6366f1;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: var(--bg-body);
    color: var(--text);
    font-family: 'Poppins', sans-serif;
}

.app {
    max-width: 1400px;
    margin: 30px auto;
    padding: 0 40px;
}

/* HEADER */
.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--text2);
    margin-bottom: 25px;
    padding-bottom: 15px;
}

.nav {
    display: flex;
    gap: 25px;
}

.nav a, .nav span {
    color: var(--text2);
    text-decoration: none;
    cursor: pointer;
}

.nav .active {
    color: var(--text);
    border-bottom: 2px solid var(--primary);
}

.profile {
    display: flex;
    gap: 10px;
}

.profile img {
    border-radius: 50%;
}

/* BOTON */
.create-btn {
    position: fixed;
    bottom: 30px;
    right: 30px;
    width: 65px;
    height: 65px;
    border-radius: 50%;
    background: var(--primary);
    color: white;
    border: none;
    cursor: pointer;
}

/* FILTROS */
.filters {
    display: grid;
    grid-template-columns: 2fr 1fr 1fr auto;
    gap: 10px;
    background: var(--card);
    padding: 12px;
    border-radius: 12px;
    margin: 20px 0;
}

/* CARRUSEL */
.hero {
    height: 250px;
    overflow: hidden;
    border-radius: 12px;
}

.slides {
    display: flex;
    width: 200%;
    animation: mover 25s linear infinite;
}

.slides img {
    width: 100%;
    object-fit: cover;
}

@keyframes mover {
    from { transform: translateX(0); }
    to { transform: translateX(-50%); }
}

/* ================= PUBLICACIONES ================= */
.publicaciones {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 20px;
}

/* TARJETA */
.post-card {
    background: var(--bg-app);
    border-radius: 16px;
    padding: 15px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.08);
    border: 1px solid var(--text2);
    display: flex;
    flex-direction: column;
    gap: 10px;
    transition: 0.3s;
}

.post-card:hover {
    transform: translateY(-8px) scale(1.02);
    box-shadow: 0 15px 35px rgba(0,0,0,0.15);
}

.post-card img {
    width: 100%;
    height: 160px;
    object-fit: cover;
    border-radius: 12px;
}

.post-card h3 {
    font-size: 18px;
}

.post-card a {
    color: var(--primary);
    text-decoration: none;
}

.post-card a:hover {
    text-decoration: underline;
}
</style>

</body>
</html>
