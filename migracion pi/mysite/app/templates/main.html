<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>ScholarReview</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<script src="https://unpkg.com/lucide@latest"></script>

<link rel="stylesheet" href="../CSS/tengosueñoxd.css">
</head>

<body>

<div class="app">

    <!-- HEADER -->
    <header class="header">
        <div class="logo">
            <i data-lucide="book"></i>
            <span>ScholarReview</span>
        </div>

        <!-- NAV -->
        <nav class="nav">
            <!-- HOME (este se queda aquí) -->
            <span class="active">Main</span>

            <!-- 🔗 AQUÍ CREAS ESTOS ARCHIVOS -->
            <a href="p.html" class="nav-link">Perfil</a>
            <a href="explorar.html" class="nav-link">Explorar</a>
            <a href="comunidad.html" class="nav-link">Comunidad</a>
        </nav>

        <div class="profile">
            <div class="theme-switch" id="themeSwitch">
                <div class="switch-track">
                    <i data-lucide="moon" class="icon icon-moon"></i>
                    <i data-lucide="sun" class="icon icon-sun"></i>
                    <div class="switch-thumb"></div>
                </div>
            </div>
            <img src="https://i.pravatar.cc/40">
        </div>
    </header>

    <!-- BOTÓN -->
    <a href="/post/"><button class="create-btn">
        <i data-lucide="square-pen"></i>
    </button></a>

    <!-- MAIN (HOME) -->
    <main class="main">

        <!-- 🔥 CARRUSEL -->
        <section class="hero">
            <div class="slides">
                <img src="../imagenes/L1.jpeg">
                <img src="../imagenes/L5.jpeg">
                <img src="../imagenes/L9.jpeg">
                <img src="../imagenes/L3.jpeg">
                <img src="../imagenes/L2.jpeg">

                <!-- duplicadas -->
                <img src="../imagenes/L1.jpeg">
                <img src="../imagenes/L5.jpeg">
                <img src="../imagenes/L9.jpeg">
                <img src="../imagenes/L3.jpeg">
                <img src="../imagenes/L2.jpeg">
            </div>
        </section>

        <!-- FILTROS -->
        <section class="filters">
            <input type="text" placeholder="Buscar...">
            <select><option>Categoría</option></select>
            <select><option>Nivel de Estudio</option></select>
            <button class="btn-search" onclick="buscar(this)">
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>
        </section>

        <div class="publicaciones">
            {% for x in i %}
                <div class="post-card">
                    <img src="{{ x.image.url }}" alt="imagen" width="200">
                    <h3>{{ x.titulo }}</h3>
                    <p>{{ x.autor }}</p>
                    <a href="{{ x.link }}" target="_blank"><p>ver link</p></a>
                    <p>{{ x.texto }}</p>
                </div>
            {% endfor %}
</div>

    </main>

</div>



<script>
/* ===== CAMBIO DE TEMA ===== */
const switchEl = document.getElementById("themeSwitch");

switchEl.addEventListener("click", () => {
    document.body.classList.toggle("dark");
    const theme = document.body.classList.contains("dark") ? "dark" : "light";
    localStorage.setItem("theme", theme);
});

/* ===== CARGA INICIAL ===== */
window.onload = () => {
    const savedTheme = localStorage.getItem("theme");
    if (savedTheme === "dark") document.body.classList.add("dark");
    lucide.createIcons();
};

/* ===== TRANSICIÓN ENTRE PÁGINAS ===== */
const links = document.querySelectorAll(".nav-link");

links.forEach(link => {
    link.addEventListener("click", function(e) {
        e.preventDefault();

        const url = this.href;

        document.body.classList.add("fade-out");

        setTimeout(() => {
            window.location.href = url;
        }, 250);
    });
});

function buscar(btn) {
  btn.classList.add("loading");

  setTimeout(() => {
    btn.classList.remove("loading");
  }, 2000); // dura 2 segundos
}
</script>



<style>
    /* ================= VARIABLES ================= */
:root {
    --bg-body: linear-gradient(135deg, #eef2ff, #e9edf5);
    --bg-app: #ffffff;
    --card: #cbd4fe;

    --text: #1e1b4b;
    --text2: #6b7280;

    --primary: #4f51f4;
}

.dark {
    --bg-body: linear-gradient(135deg, #0b0c1a, #1e293b);
    --bg-app: #1a1a2e;
    --card: #171824;

    --text: #e0e7ff;
    --text2: #9ca3af;

    --primary: #6366f1;
}

/* ================= RESET ================= */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

/* ================= TRANSICIONES ================= */
body,
.app,
.header,
.filters,
.hero,
.create-btn,
input,
select,
button {
    transition: background 0.3s ease, color 0.3s ease, border 0.3s ease;
}

/* ================= BODY ================= */
body {
    background: var(--bg-body);
    color: var(--text);
    font-family: 'Poppins', sans-serif;
}

/* ================= CONTENEDOR ================= */
.app {
    width: 100%;
    max-width: 1400px;
    margin: 30px auto;
    padding: 0 40px;
}

/* ================= HEADER ================= */
.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-bottom: 15px;
    margin-bottom: 25px;
    border-bottom: 1px solid var(--text2);
}

/* LOGO */
.logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 600;
}

/* ================= NAV (FIX DEFINITIVO) ================= */
.nav {
    display: flex;
    gap: 30px;
    font-size: 15px;
}

/* TODOS los elementos posibles */
.nav span,
.nav a,
.nav button {
    cursor: pointer;
    color: var(--text2);
    text-decoration: none;
    background: none;
    border: none;
    outline: none;
    -webkit-tap-highlight-color: transparent;
}

/* hover */
.nav span:hover,
.nav a:hover,
.nav button:hover {
    color: var(--text);
}

/* 🔒 bloquear cambios al hacer click */
.nav span:active,
.nav span:focus,
.nav span:visited,
.nav a:active,
.nav a:focus,
.nav a:visited,
.nav button:active,
.nav button:focus {
    color: var(--text2) !important;
    outline: none !important;
    box-shadow: none !important;
}

/* estado activo */
.nav .active {
    color: var(--text) !important;
    border-bottom: 2px solid var(--primary);
    padding-bottom: 5px;
}

/* mantener activo siempre */
.nav .active:active,
.nav .active:focus,
.nav .active:hover {
    color: var(--text) !important;
}

/* ================= PERFIL ================= */
.profile {
    display: flex;
    align-items: center;
    gap: 12px;
}

.profile img {
    border-radius: 50%;
}

/* ================= SWITCH ================= */
.theme-switch {
    width: 90px;
    height: 42px;
    cursor: pointer;
}

.switch-track {
    position: relative;
    width: 100%;
    height: 100%;
    background: var(--card);
    border-radius: 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 12px;
    border: 1px solid var(--text2);
}

.icon {
    width: 20px;
    height: 20px;
    color: var(--text2);
}

.switch-thumb {
    position: absolute;
    width: 34px;
    height: 34px;
    background: var(--primary);
    border-radius: 50%;
    top: 4px;
    left: 4px;
    transition: transform 0.3s ease;
}

.dark .switch-thumb {
    transform: translateX(46px);
}

/* ================= BOTÓN FLOTANTE ================= */
.create-btn {
    position: fixed;
    bottom: 30px;
    right: 30px;

    width: 65px;
    height: 65px;

    border-radius: 50%;
    border: none;

    background: linear-gradient(135deg, var(--primary), #818cf8);
    color: white;

    display: flex;
    align-items: center;
    justify-content: center;

    cursor: pointer;

    box-shadow: 0 10px 25px rgba(0,0,0,0.25);
    transition: all 0.3s ease;
    z-index: 1000;
}

.create-btn span {
    display: none;
}

.create-btn:hover {
    transform: scale(1.4) rotate(5deg);
    box-shadow: 0 15px 35px rgba(0,0,0,0.35);
}

.create-btn:active {
    transform: scale(0.95);
}

.dark .create-btn {
    background: linear-gradient(135deg, #6366f1, #a5b4fc);
}

/* ================= FILTROS ================= */
.filters {
    display: grid;
    grid-template-columns: 2fr 1fr 1fr auto;
    gap: 10px;

    background: var(--card);
    padding: 12px;
    border-radius: 12px;

    margin: 20px 0;
}

.filters input {
    width: 100%;
    padding: 10px 40px 10px 12px;

    border-radius: 10px;
    border: 1px solid var(--text2);
    background: var(--bg-app);
    color: var(--text);
}

.filters select {
    padding: 10px;
    border-radius: 10px;
    border: 1px solid var(--text2);
    background: var(--bg-app);
    color: var(--text);
}

.filters button {
    border: none;
    background: var(--primary);
    color: white;
    border-radius: 10px;
    cursor: pointer;
    padding: 0 15px;
}

.btn-search {
  width: 55px;
  height: 55px;
  border-radius: 50%;
  border: none;
  padding: 0;

  display: flex;
  align-items: center;
  justify-content: center;

  background: #0072ff;
  color: white;
  cursor: pointer;

  position: relative;
  overflow: hidden;

  box-sizing: border-box; /* 👈 evita deformaciones */
}

/* 🔍 ICONO MÁS GRANDE */
.btn-search i {
  font-size: 22px;
}

/* animación girando */
.btn-search.loading i {
  animation: spin 1s linear infinite;
}

@keyframes spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

/* efecto brillo pasando */
.btn-search.loading::after {
  content: "";
  position: absolute;
  width: 100%;
  height: 100%;
  background: linear-gradient(120deg, transparent, rgba(255,255,255,0.6), transparent);
  animation: shine 1s infinite;
}

@keyframes shine {
  from { transform: translateX(-100%); }
  to { transform: translateX(100%); }
}

/* ================= CARRUSEL ================= */
.hero {
    height: 260px;
    overflow: hidden;
    border-radius: 12px;
}

.slides {
    display: flex;
    width: 200%;
    height: 100%;
    animation: mover 25s linear infinite;
}

.slides img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

@keyframes mover {
    from { transform: translateX(0); }
    to { transform: translateX(-50%); }
}
</style>

</body>
</html>
