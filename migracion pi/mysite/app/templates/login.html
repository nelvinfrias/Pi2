<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background: white;
            padding: 2.5rem 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 420px;
        }

        h2 {
            text-align: center;
            margin-bottom: 1.8rem;
            color: #1a1a2e;
            font-size: 1.6rem;
        }

        .field {
            margin-bottom: 1.2rem;
        }

        label {
            display: block;
            margin-bottom: .4rem;
            font-weight: 600;
            font-size: .9rem;
            color: #333;
        }

        input {
            width: 100%;
            padding: .65rem .9rem;
            border: 1.5px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color .2s;
            outline: none;
        }

        input:focus { border-color: #4f46e5; }

        .error {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #dc2626;
            padding: .75rem 1rem;
            border-radius: 8px;
            font-size: .88rem;
            margin-bottom: 1rem;
        }

        .error::before { content: '⚠ '; }

        button {
            width: 100%;
            padding: .75rem;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: .5rem;
            transition: background .2s;
        }

        button:hover { background: #4338ca; }

        .signup-link {
            text-align: center;
            margin-top: 1.2rem;
            font-size: .9rem;
            color: #555;
        }

        .signup-link a {
            color: #4f46e5;
            text-decoration: none;
            font-weight: 600;
        }

        .signup-link a:hover { text-decoration: underline; }
    </style>
</head>
<body>
<div class="card">
    <h2>Iniciar sesión</h2>

    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}

    <form method="post" novalidate>
        {% csrf_token %}

        <div class="field">
            <label for="username">Usuario</label>
            <input type="text" name="username" id="username"
                   placeholder="Tu nombre de usuario" autofocus>
        </div>

        <div class="field">
            <label for="password">Contraseña</label>
            <input type="password" name="password" id="password"
                   placeholder="Tu contraseña">
        </div>

        <button type="submit">Entrar</button>
    </form>

    <p class="signup-link">
        ¿No tienes cuenta? <a href="{% url 'signup' %}">Regístrate</a>
    </p>
</div>
</body>
</html>
