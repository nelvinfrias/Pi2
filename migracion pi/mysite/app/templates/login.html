<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar Sesión</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --bg-body: linear-gradient(135deg, #f9fafb, #e5e7eb);
            --bg-card: #ffffff;
            --text-main: #111827;
            --text-muted: #6b7280;
            --border: #e5e7eb;
            --accent: #4f46e5;
            --accent-hover: #3730a3;
            --primary: #4f46e5;
        }

    /* Tema oscuro fijo */
        .dark {
            --bg-body: linear-gradient(135deg, #0b0c1a, #1e293b);
            --bg-card: #1a1a2e;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border: #2d2d2d;
            --accent: #a5b4fc;
            --accent-hover: #818cf8;
            --primary: #6366f1;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 950px;
            background: var(--bg-card);;
            border: 1px solid var(--border);
            backdrop-filter: blur(12px);
            border-radius: 25px;
            display: flex;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            animation: fadeIn 0.8s ease;
            max-height: 600px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* Imagen izquierda */
        .left-panel {
            width: 50%;
            padding: 25px;
            background: var(--bg-card);
        }

        .left-panel img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 20px;
        }

        /* Formulario */
        .right-panel {
            width: 50%;
            padding: 40px 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow-y: auto;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
            color: var(--text-main);
            padding-top:0;
        }

        .logo i {
            font-size: 20px;
            color: var(--primary);
        }

        h1 {
            text-align: center;
            font-size: 28px;
            margin-bottom: 8px;
            padding-top: 15px;
            color: var(--text-main);
        }

        p.subtitle {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 24px;
        }

        /* Cada campo del form Django */
        .field {
            position: relative;
            margin-bottom: 16px;
        }

        .field label {
            display: none; /* iconos hacen la función visual */
        }

        .field input,
        .field select,
        .field textarea {
            width: 100%;
            padding: 13px 18px 13px 46px;
            border: 1px solid var(--border);
            border-radius: 30px;
            outline: none;
            font-size: 15px;
            transition: 0.3s;
            background: var(--bg-card);
            color: var(--text-main);
        }

        .field input:focus,
        .field select:focus,
        .field textarea:focus {
            border: 1px solid var(--primary);
            box-shadow: 0 0 8px rgba(99, 102, 241, 0.3);
        }

        /* Icono por defecto para todos los campos */
        .field::before {
            content: '\f007';           /* fa-user */
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 15px;
            z-index: 1;
        }

        /* Icono email */
        .field.email::before  { content: '\f0e0'; } /* fa-envelope */
        .field.password::before { content: '\f023'; } /* fa-lock    */

        /* Errores de campo */
        .errors {
            list-style: none;
            margin-top: 6px;
            padding-left: 16px;
        }

        .errors li {
            color: #c0392b;
            font-size: 12px;
        }

        /* Errores globales (non_field_errors) */
        .non-field-errors {
            background: #fdecea;
            border: 1px solid #e74c3c;
            border-radius: 12px;
            padding: 10px 16px;
            margin-bottom: 14px;
        }

        .non-field-errors li {
            color: #c0392b;
            font-size: 13px;
            list-style: none;
        }

        .success-box {
            background: rgba(34, 197, 94, 0.12);
            border: 1px solid #22c55e;
            border-radius: 12px;
            padding: 10px 16px;
            margin-bottom: 14px;
            display: none;
        }

        .success-box li {
            color:  #22c55e;
            font-size: 13px;
            list-style: none;
        }

        /* Botón principal */
        .main-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 30px;
            background: var(--primary);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        .main-btn:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
        }

        /* Divider */
        .divider {
            text-align: center;
            margin: 18px 0;
            color: var(--text-muted);
            font-size: 14px;
        }

        /* Google */
        .google-btn, 
        a[href*="accounts/google/login"], 
        .social-login a {
            width: 100% !important;
            padding: 14px !important;
            border: 1px solid var(--border) !important;
            border-radius: 30px !important;
            background: var(--bg-card) !important;
            cursor: pointer !important;
            font-weight: bold !important;
            transition: 0.3s !important;
            margin-bottom: 14px !important;
            text-decoration: none !important;  /* ← Quita subrayado */
            color: var(--text-main) !important;       /* ← Color normal */
            display: inline-flex !important;   /* ← Alinea icono+texto */
            align-items: center !important;
            justify-content: center !important;
            box-sizing: border-box !important; /* ← Padding 100% */
            text-align: center !important;
        }

        .google-btn:hover, 
        a[href*="accounts/google/login"]:hover,
        .social-login a:hover {
            background: rgba(255,255,255,0.08) !important;
        }

        .google-btn i, 
        a[href*="accounts/google/login"] i {
            margin-right: 10px !important;
        }

        /* Link */
        .link-btn {
            background: none;
            border: none;
            color: var(--primary);
            cursor: pointer;
            font-size: 14px;
            text-align: center;
            width: 100%;
            text-decoration: none;
            display: block;
            padding-top: 10px;
        }

        .link-btn:hover {
            text-decoration: underline;
        }
        
        .olvidada {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 14px;
            text-align: center;
            width: 100%;
            text-decoration: none;
            display: block;
            padding-top: 6px;
        }

        .olvidada:hover {
            text-decoration: underline;
        }

        /* Toggle ojo contraseña */
        .toggle-password {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
            color: var(--text-muted);
            font-size: 15px;
            z-index: 1;
            transition: 0.3s;
        }

        .toggle-password:hover {
            color: var(--primary);
        }

        /* Responsive */
        @media (max-width: 900px) {
            .container {
                flex-direction: column;
                width: 100%;
            }

            .left-panel,
            .right-panel {
                width: 100%;
            }

            .left-panel {
                height: 220px;
            }

            .right-panel {
                padding: 30px 24px;
            }
        }
    </style>
</head>
<body>
    {% load static %}
    {% load socialaccount %}
<div class="container">
    <div class="left-panel">
        <img src="{% static 'imagen4.jpg' %}" alt="Imagen BookReviews">
    </div>

    <div class="right-panel">
        
        <div class="logo">
            <i class="fa-solid fa-book-open"></i>
            <span>BookReviews</span>
        </div>
        
        <h1>Inicia Sesión</h1>
        <p class="subtitle">Bienvenido de nuevo</p>

        <ul class="success-box" id="resetMessage">
            <li>Tu contraseña fue actualizada. Inicia sesión.</li>
        </ul>

        <form method="post" novalidate>
            {% csrf_token %}

            {% if error %}
            <ul class="non-field-errors">
                <li>{{ error }}</li>
            </ul>
            {% endif %}

            <div class="field">
                <input type="text" name="username" id="username" placeholder="Usuario" required>
            </div>

            <div class="field password">
                <input type="password" name="password" id="password" placeholder="Contraseña" required>
                <i class="fa-solid fa-eye toggle-password" id="togglePassword"></i>
            </div>

            <button class="main-btn" type="submit">Login</button>

            <div class="divider">o continuar con</div>

            <a href="/accounts/google/login/?process=login&prompt=select_account" class="google-btn">
                <i class="fa-brands fa-google"></i>
                Google
            </a>

            <a href="{% url 'signup' %}" class="link-btn">¿No tienes cuenta? Registrate</a>

            <a href="{% url 'account_reset_password' %}" class="olvidada">
                ¿Olvidaste tu contraseña?
            </a>

        </form>
    </div>
</div>

<script>
    const togglePassword = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('password');

    togglePassword.addEventListener('click', function () {
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            this.classList.replace('fa-eye', 'fa-eye-slash');
        } else {
            passwordInput.type = 'password';
            this.classList.replace('fa-eye-slash', 'fa-eye');
        }
    });

    const params = new URLSearchParams(window.location.search);

    if (params.get('reset') === 'ok') {
        const msg = document.getElementById('resetMessage');
        msg.style.display = 'block';

        setTimeout(() => {
            msg.style.display = 'none';
        }, 4500);
    }
        window.onload = () => {
        const savedTheme = localStorage.getItem("theme");

        if (savedTheme === "dark") {
            document.body.classList.add("dark");
        }

        if (savedTheme === "light") {
            document.body.classList.remove("dark");
        }
    };

</script>


</body>
</html>
