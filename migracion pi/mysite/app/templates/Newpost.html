<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crear Post</title>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

    <style>
        :root {
            --bg: #070c1a;
            --surface: #0d1428;
            --surface-2: #0a1020;
            --border: #1a2847;
            --border-hover: #243a6e;
            --accent: #2a5ccc;
            --accent-hover: #3468e0;
            --text: #c5d4f5;
            --text-muted: #3d5490;
            --text-secondary: #7a8fbe;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 2.5rem 1rem;
        }

        .card {
            background: var(--surface);
            border: 0.5px solid var(--border);
            border-radius: 20px;
            width: 100%;
            max-width: 480px;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.4rem;
        }

        .page-title {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            letter-spacing: 0.12em;
            text-transform: uppercase;
            text-align: center;
        }

        hr.div {
            border: none;
            height: 0.5px;
            background: var(--border);
        }

        /* ── AUTOR ── */
        .autor-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .autor-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid var(--border-hover);
            flex-shrink: 0;
        }

        .autor-placeholder {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #111e3a;
            border: 1px solid var(--border-hover);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 15px;
            flex-shrink: 0;
        }

        .autor-info { flex: 1; }

        .autor-name {
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
        }

        .autor-sub {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 1px;
        }

        .btn-perfil {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-muted);
            border: 0.5px solid var(--border);
            border-radius: 8px;
            padding: 5px 10px;
            background: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            text-decoration: none;
            transition: 0.2s;
            white-space: nowrap;
        }

        .btn-perfil:hover {
            border-color: var(--border-hover);
            color: var(--text-secondary);
        }

        /* ── IMAGE DROP ── */
        .img-drop {
            width: 100%;
            height: 155px;
            border: 1px dashed var(--border);
            border-radius: 13px;
            background: var(--surface-2);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 7px;
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
            position: relative;
            overflow: hidden;
        }

        .img-drop:hover {
            border-color: var(--accent);
            background: #080f20;
        }

        .img-drop.active {
            border-style: solid;
            border-color: var(--border);
        }

        .img-drop img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        .img-drop.active img { display: block; }
        .img-drop.active .drop-hint { display: none; }

        .drop-icon {
            font-size: 22px;
            color: var(--text-muted);
        }

        .drop-hint {
            font-size: 12px;
            color: var(--text-muted);
            text-align: center;
            line-height: 1.5;
        }

        /* ── FIELDS ── */
        .fields-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .field-full { grid-column: 1 / -1; }

        .field { display: flex; flex-direction: column; gap: 5px; }

        .field label {
            font-size: 10px;
            font-weight: 600;
            color: var(--text-muted);
            letter-spacing: 0.09em;
            text-transform: uppercase;
        }

        .field input,
        .field textarea,
        .field select {
            background: var(--surface-2);
            border: 0.5px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-size: 13px;
            font-family: 'Montserrat', sans-serif;
            padding: 10px 12px;
            outline: none;
            transition: border-color 0.2s, background 0.2s;
            width: 100%;
        }

        .field input:focus,
        .field textarea:focus,
        .field select:focus {
            border-color: var(--accent);
            background: #080f20;
        }

        .field textarea {
            resize: none;
            height: 85px;
        }

        .field select option { background: var(--surface); }

        /* ── HIDDEN FILE INPUT ── */
        input[type="file"] { display: none; }

        /* ── SUBMIT ── */
        button[type="submit"] {
            width: 100%;
            padding: 11px;
            background: var(--accent);
            border: none;
            border-radius: 11px;
            color: #e8f0ff;
            font-size: 13px;
            font-weight: 600;
            font-family: 'Montserrat', sans-serif;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            letter-spacing: 0.04em;
            transition: background 0.2s;
        }

        button[type="submit"]:hover { background: var(--accent-hover); }

        .back-row {
            text-align: center;
            font-size: 12px;
        }

        .back-row a {
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.2s;
        }

        .back-row a:hover { color: var(--text-secondary); }
    </style>
</head>
<body>

<div class="card">

    <p class="page-title">Nueva reseña</p>

    <hr class="div">

    <!-- Autor -->
    <div class="autor-row">
        {% if request.user.profile.foto %}
            <img src="{{ request.user.profile.foto.url }}" class="autor-avatar" alt="{{ request.user.username }}">
        {% else %}
            <div class="autor-placeholder"><i class="fa-solid fa-user"></i></div>
        {% endif %}
        <div class="autor-info">
            <div class="autor-name">{{ request.user.username }}</div>
            <div class="autor-sub">Publicando como</div>
        </div>
        <a href="{% url 'ver_perfil' request.user.username %}" class="btn-perfil" target="_blank">
            <i class="fa-solid fa-user"></i> Ver perfil
        </a>
    </div>

    <hr class="div">

    <!-- Preview imagen -->
    <div class="img-drop" id="previewBox">
        <img id="preview" src="" alt="">
        <i class="fa-regular fa-image drop-icon drop-hint"></i>
        <span class="drop-hint">Clic o arrastra una imagen</span>
    </div>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <!-- Campo imagen oculto (Django lo renderiza, lo ocultamos con CSS) -->
        {{ i.image }}

        <div class="fields-grid">

            <div class="field field-full">
                <label>Título del libro</label>
                {{ i.titulo }}
            </div>

            <div class="field">
                <label>Autor del libro</label>
                {{ i.autor }}
            </div>

            <div class="field">
                <label>Categoría</label>
                {{ i.Category }}
            </div>

            <div class="field field-full">
                <label>Link</label>
                {{ i.link }}
            </div>

            <div class="field field-full">
                <label>Descripción</label>
                {{ i.texto }}
            </div>

        </div>
        <br>
        <button type="submit">
            <i class="fa-solid fa-paper-plane"></i> Publicar reseña
        </button>
    </form>
    <div class="back-row">
        <a href="/home/">← Volver al inicio</a>
    </div>
</div>

<div id="modalError" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);justify-content:center;align-items:center;z-index:9999;">
    <div style="background:var(--card);padding:25px;border-radius:15px;width:90%;max-width:350px;text-align:center;border:1px solid var(--border);color:var(--text);">
        <h2 style="margin-bottom:15px;">Error</h2>
        <p id="mensajeError"></p>
        <button onclick="cerrarModal()" style="margin-top:20px;padding:10px 20px;border:none;border-radius:10px;background:var(--primary);color:white;cursor:pointer;">
            Cerrar
        </button>
    </div>
</div>

<script>
    const previewBox  = document.getElementById("previewBox");
    const fileInput = document.querySelector('form input[type="file"]');
    const preview     = document.getElementById("preview");

    function loadFile(file) {
        if (!file || !file.type.startsWith("image/")) return;
        const reader = new FileReader();
        reader.onload = ev => {
            preview.src = ev.target.result;
            previewBox.classList.add("active");
        };
        reader.readAsDataURL(file);
    }

    previewBox.addEventListener("click", (e) => {
        e.stopPropagation();
        fileInput.click()
    });
    fileInput.addEventListener("change", function() { loadFile(this.files[0]); });

    previewBox.addEventListener("dragover", e => {
        e.preventDefault();
        previewBox.style.borderColor = "var(--accent)";
    });
    previewBox.addEventListener("dragleave", () => {
        previewBox.style.borderColor = "";
    });
    previewBox.addEventListener("drop", e => {
        e.preventDefault();
        previewBox.style.borderColor = "";
        const file = e.dataTransfer.files[0];
        if (!file) return;
        const dt = new DataTransfer();
        dt.items.add(file);
        fileInput.files = dt.files;
        loadFile(file);
        });    

window.onload = function(){
    const savedTheme = localStorage.getItem("theme");
    if(savedTheme === "dark"){
        document.body.classList.add("dark");
    }
    lucide.createIcons();
}

document.querySelector("form").addEventListener("submit", function(e){

    const groserias = [
        "pendejo","pendeja","puta","puto","verga","idiota",
        "mierda","culero","culera","chingar","chinga","chingada",
        "pinche","pinches","joder","coño","cabrón","cabrona",
        "zorra","maricón","maricones","imbécil","estúpido",
        "estúpida","tarado","tarada","hijo de puta",
        "hija de puta","puta madre","chinga tu madre",
        "maldito","maldita","pana"
    ];

    const titulo = document.querySelector('input[name="titulo"]');
    const descripcion = document.querySelector('textarea[name="texto"]');

    let texto = "";

    if(titulo){
        texto += titulo.value.toLowerCase().trim();
    }

    if(descripcion){
        texto += " " + descripcion.value.toLowerCase().trim();
    }

    // elimina signos para comparar mejor
    texto = texto.replace(/[.,!?¿¡:;"'()\-_/]/g, " ");

    for(let palabra of groserias){

        // para frases como "hijo de puta"
        if(palabra.includes(" ")){
            if(texto.includes(palabra)){
                e.preventDefault();
                mostrarModal("❌ No puedes usar lenguaje ofensivo");
                return;
            }
        }

        // para palabras exactas
        else{
            const regex = new RegExp("\\b" + palabra + "\\b", "i");

            if(regex.test(texto)){
                e.preventDefault();
                mostrarModal("❌ No puedes usar lenguaje ofensivo");
                return;
            }
        }
    }

});

function mostrarModal(mensaje){

    document.getElementById("mensajeError").innerText = mensaje;
    document.getElementById("modalError").style.display = "flex";
}

function cerrarModal(){

    document.getElementById("modalError").style.display = "none";
}
</script>

<!-- MODAL ERROR -->
<div id="modalError" style="
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.7);
    justify-content:center;
    align-items:center;
    z-index:9999;
">

    <div style="
        background:#161b22;
        padding:25px;
        border-radius:15px;
        width:90%;
        max-width:350px;
        text-align:center;
        border:1px solid #30363d;
        color:white;
    ">

        <h2 style="margin-bottom:15px;">Error</h2>

        <p id="mensajeError"></p>

        <button onclick="cerrarModal()" style="
            margin-top:20px;
            padding:10px 20px;
            border:none;
            border-radius:10px;
            background:#2f81f7;
            color:white;
            cursor:pointer;
        ">
            Cerrar
        </button>

    </div>
</div>
