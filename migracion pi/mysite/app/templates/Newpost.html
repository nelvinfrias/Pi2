<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crear Post</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://unpkg.com/lucide@latest"></script>

<style>
    :root{
    --bg:#f4f7fb;
    --card:#ffffff;
    --soft:#f8fafc;
    --header:#ffffff;
    --border:#e5e7eb;
    --text:#111827;
    --text2:#6b7280;
    --primary:#4039b7;
    --hover:#3428b3;
    --danger:#ef4444;
    --shadow:0 10px 35px rgba(15,23,42,.08);
}

.dark{
    --bg:#0b1120;
    --card:#111827;
    --soft:#182233;
    --header:#0f172a;
    --border:#263244;
    --text:#f8fafc;
    --text2:#94a3b8;
    --primary:#4043ed;
    --hover:#7c83ff;
    --danger:#f87171;
    --shadow:0 15px 40px rgba(0,0,0,.45);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Outfit',sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
}

.header{
    width:100%;
    height:65px;
    background:var(--header);
    border-bottom:1px solid var(--border);
    position:sticky;
    top:0;
    z-index:100;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0 25px;
}

.logo{
    position:absolute;
    left:25px;
    display:flex;
    align-items:center;
    gap:10px;
    font-size:18px;
    font-weight:700;
}

.logo svg{
    width:20px;
    height:20px;
    stroke:var(--text);
}

.close-btn{
    position:absolute;
    right:25px;
    font-size:22px;
    color:var(--text2);
    text-decoration:none;
}

.wrapper{
    width:100%;
    min-height:calc(100vh - 65px);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.card{
    width:100%;
    max-width:1180px;
    min-height:620px;
    background:var(--card);
    border-radius:18px;
    box-shadow:var(--shadow);
    border:1px solid var(--border);
    overflow:hidden;
    display:flex;
}

/* IZQUIERDA */

.left{
    width:340px;
    background:var(--card);
    border-right:1px solid var(--border);
    padding:18px;
    display:flex;
    flex-direction:column;
    gap:16px;
}

.autor-card{
    width:100%;
    display:flex;
    align-items:center;
    gap:12px;
    background:var(--soft);
    border:1px solid var(--border);
    border-radius:14px;
    padding:14px;
}

.autor-avatar,
.autor-placeholder{
    width:48px;
    height:48px;
    border-radius:50%;
    object-fit:cover;
    border:2px solid var(--primary);
}

.autor-placeholder{
    display:flex;
    justify-content:center;
    align-items:center;
    background:var(--card);
    font-size:1.2rem;
}

.autor-info{
    display:flex;
    flex-direction:column;
}

.autor-nombre{
    font-size:14px;
    font-weight:700;
    color:var(--primary);
}

.autor-label{
    font-size:12px;
    color:var(--text2);
}

/* PREVIEW */
.preview-img{
    width:100%;
    height:470px;
    border-radius:18px;
    overflow:hidden;
    background:linear-gradient(135deg,#4f46e5,#6366f1);
    border:2px dashed rgba(255,255,255,.25);
    position:relative;
}
.preview-img img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:none;
}

.preview-img.active img{
    display:block;
}

.placeholder{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    text-align:center;
    color:white;
    font-size:14px;
    line-height:1.8;
}

/* DERECHA */

.right{
    flex:1;
    padding:34px;
}

.right h2{
    font-size:27px;
    font-weight:800;
    margin-bottom:20px;
}

/* FORM */

form{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px;
}

.field{
    display:flex;
    flex-direction:column;
}

.field.full{
    grid-column:1/3;
}

label{
    margin-bottom:8px;
    font-size:14px;
    font-weight:700;
    color:var(--text2);
}

input,
textarea,
select{
    width:100%;
    background:var(--soft);
    border:1.5px solid var(--border);
    border-radius:16px;
    padding:14px;
    font-size:14px;
    color:var(--text);
    outline:none;
    font-family:'Poppins',sans-serif;
}

input:focus,
textarea:focus,
select:focus{
    border-color:var(--primary);
}

input[type="file"]{
    padding:12px;
    cursor:pointer;
}

input[type="file"]::-webkit-file-upload-button{
    background:var(--primary);
    color:white;
    border:none;
    padding:10px 14px;
    border-radius:10px;
    margin-right:12px;
    cursor:pointer;
}

textarea{
    min-height:190px;
    max-height:190px;
    resize:none;
}

/* BOTONES */

.buttons{
    margin-top:2px;
    display:flex;
    gap:16px;
    grid-column:1/3;
}

.save-btn,
.cancel-btn{
    flex:1;
    height:56px;
    border:none;
    border-radius:16px;
    font-size:15px;
    font-weight:700;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
    cursor:pointer;
    text-decoration:none;
    transition:.25s;
}

.save-btn{
    background:var(--primary);
    color:white;
}

.cancel-btn{
    background:var(--soft);
    color:var(--text2);
}


.save-btn:hover{
    background:var(--hover);
}

.cancel-btn:hover{
    background:var(--hover);
    color:white;
}

/* RESPONSIVE */

@media(max-width:950px){

    .card{
        flex-direction:column;
    }

    .left{
        width:100%;
        border-right:none;
        border-bottom:1px solid var(--border);
    }

    .preview-img{
        height:280px;
    }

    form{
        grid-template-columns:1fr;
    }

    .field.full,
    .buttons{
        grid-column:auto;
    }

    .buttons{
        flex-direction:column;
    }
}
</style>
</head>
<body>

<header class="header">
    <div class="logo">
        <i data-lucide="book"></i>
        <span>ScholarReview</span>
    </div>

    <h1>Crear Post</h1>

    <a href="/home/" class="close-btn">
        <i class="fa-solid fa-xmark"></i>
    </a>
</header>

<div class="wrapper">
<div class="card">

<div class="left">
    <div class="autor-card">
        {% if request.user.profile.foto %}
            <img src="{{ request.user.profile.foto.url }}" class="autor-avatar">
        {% else %}
            <div class="autor-placeholder">👤</div>
        {% endif %}
        <div class="autor-info">
            <span class="autor-nombre">{{ request.user.username }}</span>
            <span class="autor-label">Publicando como</span>
        </div>
    </div>

    <div class="preview-img" id="previewBox">
        <img id="preview" src="">
        <span class="placeholder" id="placeholder">
            <i class="fa-regular fa-image"></i><br>
            Vista previa
        </span>
    </div>
</div>

<div class="right">
    <h2>Nuevo post</h2>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <div class="field">
            <label>Imagen</label>
            {{ i.image }}
        </div>

        <div class="field">
            <label>Título</label>
            {{ i.titulo }}
        </div>

        <div style="display:none;">
            {{ i.autor }}
        </div>

        <div class="field">
            <label>Link</label>
            {{ i.link }}
        </div>

        <div class="field">
            <label>Categoría</label>
            {{ i.Category }}
        </div>

        <div class="field full">
            <label>Descripción</label>
            {{ i.texto }}
        </div>

        <div class="buttons">
            <a href="/home/" class="cancel-btn">
                Cancelar
            </a>

            <button type="submit" class="save-btn">
                <i class="fa-solid fa-paper-plane"></i>
                Publicar
            </button>
        </div>
    </form>
</div>

</div>
</div>

<div id="modalError" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);justify-content:center;align-items:center;z-index:9999;">
    <div style="background:var(--card);padding:25px;border-radius:15px;width:90%;max-width:350px;text-align:center;border:1px solid var(--border);color:var(--text);">
        <h2 style="margin-bottom:15px;">Error</h2>
        <p id="mensajeError"></p>
        <button onclick="cerrarModal()" style="margin-top:20px;padding:10px 20px;border:none;border-radius:10px;background:var(--primary);color:white;cursor:pointer;">
            Cerrar
        </button>
    </div>
</div>

<script>
window.onload = function(){
    const savedTheme = localStorage.getItem("theme");
    if(savedTheme === "dark"){
        document.body.classList.add("dark");
    }
    lucide.createIcons();
}
</script>

</body>
</html>

<script>
    // =========================
    // PREVIEW DE IMAGEN
    // =========================
    document.addEventListener("change", function(e){
        if(e.target.type === "file"){
            const file = e.target.files[0];

            if(!file) return;

            const reader = new FileReader();

            reader.onload = function(ev){
                document.getElementById("preview").src = ev.target.result;

                document.getElementById("previewBox")
                    .classList.add("active");

                document.getElementById("placeholder")
                    .style.display = "none";
            }

            reader.readAsDataURL(file);
        }
    });


    // =========================
    // AUTOR AUTOMÁTICO
    // =========================
    window.addEventListener("load", function(){

        const autorInput =
            document.querySelector('input[name="autor"]');

        if(autorInput){
            autorInput.value = "{{ request.user.username }}";
        }

    });

document.querySelector("form").addEventListener("submit", function(e){

    const groserias = [
        "pendejo","pendeja","puta","puto","verga","idiota",
        "mierda","culero","culera","chingar","chinga","chingada",
        "pinche","pinches","joder","coño","cabrón","cabrona",
        "zorra","maricón","maricones","imbécil","estúpido",
        "estúpida","tarado","tarada","hijo de puta",
        "hija de puta","puta madre","chinga tu madre",
        "maldito","maldita","pana"
    ];

    const titulo = document.querySelector('input[name="titulo"]');
    const descripcion = document.querySelector('textarea[name="texto"]');

    let texto = "";

    if(titulo){
        texto += titulo.value.toLowerCase().trim();
    }

    if(descripcion){
        texto += " " + descripcion.value.toLowerCase().trim();
    }

    // elimina signos para comparar mejor
    texto = texto.replace(/[.,!?¿¡:;"'()\-_/]/g, " ");

    for(let palabra of groserias){

        // para frases como "hijo de puta"
        if(palabra.includes(" ")){
            if(texto.includes(palabra)){
                e.preventDefault();
                mostrarModal("❌ No puedes usar lenguaje ofensivo");
                return;
            }
        }

        // para palabras exactas
        else{
            const regex = new RegExp("\\b" + palabra + "\\b", "i");

            if(regex.test(texto)){
                e.preventDefault();
                mostrarModal("❌ No puedes usar lenguaje ofensivo");
                return;
            }
        }
    }

});

function mostrarModal(mensaje){

    document.getElementById("mensajeError").innerText = mensaje;
    document.getElementById("modalError").style.display = "flex";
}

function cerrarModal(){

    document.getElementById("modalError").style.display = "none";
}
</script>

<!-- MODAL ERROR -->
<div id="modalError" style="
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.7);
    justify-content:center;
    align-items:center;
    z-index:9999;
">

    <div style="
        background:#161b22;
        padding:25px;
        border-radius:15px;
        width:90%;
        max-width:350px;
        text-align:center;
        border:1px solid #30363d;
        color:white;
    ">

        <h2 style="margin-bottom:15px;">Error</h2>

        <p id="mensajeError"></p>

        <button onclick="cerrarModal()" style="
            margin-top:20px;
            padding:10px 20px;
            border:none;
            border-radius:10px;
            background:#2f81f7;
            color:white;
            cursor:pointer;
        ">
            Cerrar
        </button>

    </div>
</div>
