<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Post</title>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@1,600;1,700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

    <style>
        :root {
            --bg: #0d1117;
            --card: #161b22;
            --border: #30363d;
            --text: #e6edf3;
            --accent: #2f81f7;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .modal-box {
            background: var(--card);
            width: 100%;
            max-width: 500px;
            padding: 20px;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            border: 1px solid var(--border);
        }

        h1 {
            text-align: center;
        }

        form p {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        input, textarea {
            padding: 10px;
            border-radius: 10px;
            border: none;
            background: #0d1117;
            color: var(--text);
        }

        textarea {
            resize: none;
        }

        .preview-img {
            width: 100%;
            height: 180px;
            border-radius: 15px;
            overflow: hidden;
        }

        .preview-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        button {
            background: var(--accent);
            border: none;
            padding: 10px;
            border-radius: 10px;
            color: white;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.05);
        }
    </style>
</head>

<body>

<div class="modal-box">

    <h1>Crear nuevo Post</h1>

    <div class="preview-img">
        <img id="preview" src="">
    </div>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        {{ i.as_p }}
        <button type="submit">
            <i class="fa-solid fa-paper-plane"></i> Crear
        </button>
    </form>

</div>

<script>
    document.addEventListener("change", function(e){
        if(e.target.type === "file"){
            const file = e.target.files[0];
            if(!file) return;

            const reader = new FileReader();
            reader.onload = function(ev){
                document.getElementById("preview").src = ev.target.result;
            }
            reader.readAsDataURL(file);
        }
    });
</script>

</body>
</html>
