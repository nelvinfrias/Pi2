<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Post</title>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

    <style>
        :root {
            --bg: #0d1117;
            --card: #161b22;
            --border: #30363d;
            --text: #e6edf3;
            --accent: #2f81f7;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Montserrat', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 30px 0;
        }

        .modal-box {
            background: var(--card);
            width: 100%;
            max-width: 500px;
            padding: 25px;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            border: 1px solid var(--border);
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        h1 {
            text-align: center;
            font-size: 22px;
            font-weight: 700;
        }

        /* ── AUTOR CARD ── */
        .autor-card {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #0d1117;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px 14px;
        }

        .autor-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--accent);
        }

        .autor-placeholder {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: #30363d;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            border: 2px solid var(--accent);
        }

        .autor-info {
            display: flex;
            flex-direction: column;
        }

        .autor-nombre {
            font-size: 14px;
            font-weight: 700;
            color: var(--accent);
        }

        .autor-label {
            font-size: 11px;
            color: #6e7681;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 13px;
            font-weight: 600;
            color: #8b949e;
        }

        input, textarea, select {
            padding: 12px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: #0d1117;
            color: var(--text);
            outline: none;
            transition: 0.2s;
            font-family: 'Montserrat', sans-serif;
            width: 100%;
        }

        input:focus, textarea:focus, select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(47,129,247,0.2);
        }

        textarea { resize: none; }

        .preview-img {
            position: relative;
            width: 100%;
            height: 180px;
            border-radius: 15px;
            overflow: hidden;
            border: 1px dashed var(--border);
            background: #0d1117;
            transition: 0.3s;
        }

        .preview-img:hover {
            border-color: var(--accent);
            box-shadow: 0 0 10px rgba(47,129,247,0.3);
        }

        .preview-img.active { border-style: solid; }

        .preview-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        .preview-img.active img { display: block; }

        .placeholder {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 13px;
            color: #6e7681;
            pointer-events: none;
            text-align: center;
        }

        button[type="submit"] {
            background: var(--accent);
            border: none;
            padding: 12px;
            border-radius: 12px;
            color: white;
            cursor: pointer;
            font-weight: 600;
            letter-spacing: 0.5px;
            transition: 0.25s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            width: 100%;
        }

        button[type="submit"]:hover {
            transform: scale(1.04);
            box-shadow: 0 5px 15px rgba(47,129,247,0.4);
        }

        .back-link {
            text-align: center;
            font-size: 13px;
        }

        .back-link a {
            color: #6e7681;
            text-decoration: none;
        }

        .back-link a:hover { color: var(--text); }
    </style>
</head>

<body>
<div class="modal-box">

    <h1>Crear nuevo Post</h1>

    <!-- AUTOR AUTOMÁTICO -->
    <div class="autor-card">
        {% if request.user.profile.foto %}
            <img src="{{ request.user.profile.foto.url }}" class="autor-avatar">
        {% else %}
            <div class="autor-placeholder">👤</div>
        {% endif %}
        <div class="autor-info">
            <span class="autor-nombre">{{ request.user.username }}</span>
            <span class="autor-label">Publicando como</span>
        </div>
    </div>

    <div class="preview-img" id="previewBox">
        <img id="preview" src="">
        <span class="placeholder" id="placeholder">
            <i class="fa-regular fa-image"></i><br>
            Vista previa de imagen
        </span>
    </div>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <div class="field">
            <label>Imagen</label>
            {{ i.image }}
        </div>

        <div class="field">
            <label>Título</label>
            {{ i.titulo }}
        </div>

        <!-- CAMPO AUTOR OCULTO: se llena automáticamente con el username -->
        <div class="field" style="display:none;">
            {{ i.autor }}
        </div>

        <div class="field">
            <label>Link</label>
            {{ i.link }}
        </div>

        <div class="field">
            <label>Descripción</label>
            {{ i.texto }}
        </div>

        <div class="field">
            <label>Categoría</label>
            {{ i.Category }}
        </div>

        <button type="submit">
            <i class="fa-solid fa-paper-plane"></i> Publicar
        </button>

    </form>

    <div class="back-link">
        <a href="/home/">← Volver al inicio</a>
    </div>

</div>

<script>
    // =========================
    // PREVIEW DE IMAGEN
    // =========================
    document.addEventListener("change", function(e){
        if(e.target.type === "file"){
            const file = e.target.files[0];

            if(!file) return;

            const reader = new FileReader();

            reader.onload = function(ev){
                document.getElementById("preview").src = ev.target.result;

                document.getElementById("previewBox")
                    .classList.add("active");

                document.getElementById("placeholder")
                    .style.display = "none";
            }

            reader.readAsDataURL(file);
        }
    });


    // =========================
    // AUTOR AUTOMÁTICO
    // =========================
    window.addEventListener("load", function(){

        const autorInput =
            document.querySelector('input[name="autor"]');

        if(autorInput){
            autorInput.value = "{{ request.user.username }}";
        }

    });


    // =========================
    // VALIDACIÓN DE GROSERÍAS
    // =========================
    document.querySelector("form")
    .addEventListener("submit", function(e){

        const groserias = [
            "pendejo",
            "pendeja",
            "puta",
            "puto",
            "verga",
            "idiota",
            "mierda",
            "culero",
            "culera",
            "chingar",
            "chinga",
            "chingada",
            "pinche",
            "pinches",
            "joder",
            "coño",
            "cabrón",
            "cabrona",
            "zorra",
            "maricón",
            "maricones",
            "imbécil",
            "estúpido",
            "estúpida",
            "tarado",
            "tarada",
            "hijo de puta",
            "hija de puta",
            "puta madre",
            "chinga tu madre",
            "maldito",
            "maldita",
            "pana"
        ];

        const titulo =
            document.querySelector('input[name="titulo"]');

        const descripcion =
            document.querySelector('textarea[name="texto"]');

        let texto = "";

        if(titulo){
            texto += titulo.value.toLowerCase();
        }

        if(descripcion){
            texto += " " + descripcion.value.toLowerCase();
        }

        for(let palabra of groserias){

            if(texto.includes(palabra)){

                e.preventDefault();

                mostrarModal(
                    "❌ No puedes usar lenguaje ofensivo"
                );

                return;
            }
        }

    });


    // =========================
    // MODAL
    // =========================
    function mostrarModal(mensaje){

        document.getElementById("mensajeError")
            .innerText = mensaje;

        document.getElementById("modalError")
            .style.display = "flex";
    }

    function cerrarModal(){

        document.getElementById("modalError")
            .style.display = "none";
    }

</script>
</script>

<!-- MODAL ERROR -->
<div id="modalError" style="
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.7);
    justify-content:center;
    align-items:center;
    z-index:9999;
">

    <div style="
        background:#161b22;
        padding:25px;
        border-radius:15px;
        width:90%;
        max-width:350px;
        text-align:center;
        border:1px solid #30363d;
        color:white;
    ">

        <h2 style="margin-bottom:15px;">
            Error
        </h2>

        <p id="mensajeError"></p>

        <button onclick="cerrarModal()" style="
            margin-top:20px;
            padding:10px 20px;
            border:none;
            border-radius:10px;
            background:#2f81f7;
            color:white;
            cursor:pointer;
        ">
            Cerrar
        </button>

    </div>
</div>

</body>
</html>
</body>
</html>
