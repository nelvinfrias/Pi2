<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" href="../CSS/usuariooficial.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
</head>
<body>
<form onsubmit="event.preventDefault(); window.iniciarSesion();">

    <div class="container">

    <!-- Imagen -->
    <div class="left-panel">
        <img src="../imagenes/imagen4.jpg" alt="Imagen">
    </div>

    <!-- Formulario -->
    <div class="right-panel">

        <div class="logo">
            <i class="fa-solid fa-book-open"></i>
            <span>BookReviews</span>
        </div>

        <h1>Inicia Sesión</h1>
        <p>Bienvenido de nuevo</p>

        <form onsubmit="event.preventDefault(); window.iniciarSesion();">

            <div class="input-box">
                <i class="fa-solid fa-envelope input-icon"></i>
                <input type="email" id="email" placeholder="Correo" required>
            </div>

            <div class="input-box">
                <i class="fa-solid fa-lock input-icon"></i>
                <input type="password" id="password" placeholder="Contraseña" required>
                <i class="fa-solid fa-eye toggle-password" id="togglePassword"></i>
            </div>

            <button class="main-btn" type="submit">Login</button>

            <div class="divider">o continuar con</div>

            <button type="button" onclick="loginGoogle()" class="google-btn">
                <i class="fa-brands fa-google"></i>
                Google
            </button>

            <button type="button" class="link-btn"
                onclick="window.location.href='registro.html'">
                ¿No tienes cuenta? Regístrate
            </button>

        </form>
    </div>
</div>

<script type="module">
    import '../JS/supabase.js';
    import '../JS/buttonp.js';
</script>

</body>
</html>
