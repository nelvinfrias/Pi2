<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Proyecto Integrador</title>
    <link rel="stylesheet" href="../CSS/usuariooficial.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
</head>
<body>

<form onsubmit="event.preventDefault(); window.iniciarSesion();">

    <div class="caja">
        
        <div class="caja2">
        
            <div class="titulocaja">
                <i class="fa-solid fa-book-open"></i>
                <h2 class="anix">Iniciar Sesión</h2>
            </div>

            <div class="in">
                <input type="email" id="email" placeholder="Correo" required>
                <i class="fa fa-envelope"></i>
            </div>

            <div class="in">
                <input type="password" id="password" placeholder="Contraseña" required>
                <i class="fa fa-lock"></i>
            </div>

            <div class="botones">
                <button class="ani" type="submit">Iniciar Sesión</button>
                <button type="button" class="cancel" onclick="goBack()">Cancelar</button>
            </div>

            <button type="button" class="register" onclick="window.location.href='registro.html'">
                ¿No tienes cuenta?
            </button>

        </div>

        <div class="imagenbook">
            <img src="../imagenes/icon2.png">
        </div>

    </div>
</form>

<script type="module">
    import '../JS/supabase.js';
</script>

<script>
window.goBack = function () {
    window.history.back()
}
</script>
</body>
</html>
