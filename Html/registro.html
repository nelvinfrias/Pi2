<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Proyecto Integrador</title>
    <link rel="stylesheet" href="../CSS/usuariooficial.css">

    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
</head>
<body>

<form onsubmit="event.preventDefault(); registrarUsuario();">

    <div class="caja">
        <div class="caja2">
            <div class="titulocaja">
                <i class="fa-solid fa-book-open"></i>
                <h2 class="anix">Empieza a aprender</h2>
            </div>
            
            <div class="in">

                <input type="email" id="email" placeholder="Correo" required>
                <i class="fa fa-envelope"></i> 
            </div>
        
            <div class="in">
                <input type="text" id="nombre" placeholder="Usuario" required>
                <i class="fa fa-user"></i>
            </div>

            <div class="in">
                <input type="password" id="password" placeholder="Contraseña" required>
                <i class="fa fa-lock"></i>
            </div>
            
            <div class="juntos">
                <button type="submit" class="register">Registrarse</button>
                <a href="barraInicio.html" class="register">Cancelar</a>
            </div>

            <button type="button" onclick="loginGoogle()" class="google-text">
                <i class="fa-brands fa-google" style="margin-right: 8px;"></i>
                Continuar con Google
            </button>
  
        </div>

        <div class="imagenbook">
            <img src="../imagenes/icon2.png">
        </div>

    </div>

</form>
    
    <script type="module">
        import '../JS/supabase.js';
    </script>

</body>
</html>
