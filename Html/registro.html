<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro</title>

<link rel="stylesheet" href="../CSS/usuariooficial.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>
<body>

<div class="container">

    <div class="left-panel">
        <img src="../imagenes/imagen4.jpg" alt="Imagen">
    </div>

    <div class="right-panel">

        <div class="logo">
            <i class="fa-solid fa-book-open"></i>
            <span>BookReviews</span>
        </div>

        <h1>Crear Cuenta</h1>
        <p>Empieza a aprender</p>

        <form onsubmit="event.preventDefault(); registrarUsuario();">

            <div class="input-box">
                <i class="fa-solid fa-envelope input-icon"></i>
                <input type="email" id="email" placeholder="Correo" required>
            </div>

            <div class="input-box">
                <i class="fa-solid fa-user input-icon"></i>
                <input type="text" id="nombre" placeholder="Usuario" required>
            </div>

            <div class="input-box">
                <i class="fa-solid fa-lock input-icon"></i>
                <input type="password" id="password" placeholder="Contraseña" required>
                <i class="fa-solid fa-eye toggle-password" id="togglePassword"></i>
            </div>

            <button class="main-btn" type="submit">Registrarse</button>

            <div class="divider">o continuar con</div>

            <button type="button" onclick="loginGoogle()" class="google-btn">
                <i class="fa-brands fa-google"></i>
                Google
            </button>

            <button type="button" class="link-btn"
                onclick="window.location.href='usuariooficial.html'">
                ¿Ya tienes cuenta? Inicia sesión
            </button>

        </form>
    </div>
</div>

<script type="module">
    import '../JS/supabase.js';
    import '../JS/buttonp.js';
</script>

</body>
</html>
